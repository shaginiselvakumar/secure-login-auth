<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Create Account — SecureCorp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-orb orb1"></div>
  <div class="bg-orb orb2"></div>

  <main class="login-wrap">
    <div class="login-card" role="main">

      <div class="brand">
        <div class="brand-icon" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <rect width="28" height="28" rx="8" fill="currentColor" opacity="0.12"/>
            <path d="M8 14L12 18L20 10" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <span class="brand-name">SecureCorp</span>
      </div>

      <div class="card-header">
        <h1>Create account</h1>
        <p>Sign up to get started with SecureCorp</p>
      </div>

      <div id="alert-box" class="alert" role="alert" aria-live="polite" aria-atomic="true" hidden></div>

      <form id="signup-form" novalidate autocomplete="on">
        <input type="hidden" id="csrf-token" name="_csrf" value="">

        <div class="field-group">
          <label for="name">Full name</label>
          <div class="input-wrap">
            <input type="text" id="name" name="name" autocomplete="name"
              placeholder="Jane Smith" maxlength="100" required aria-required="true"
              aria-describedby="name-error">
            <div class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z" fill="currentColor"/>
              </svg>
            </div>
          </div>
          <span id="name-error" class="field-error" role="alert" aria-live="polite"></span>
        </div>

        <div class="field-group">
          <label for="email">Email address</label>
          <div class="input-wrap">
            <input type="email" id="email" name="email" autocomplete="username email"
              placeholder="you@company.com" maxlength="254" required aria-required="true"
              aria-describedby="email-error">
            <div class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z" fill="currentColor"/>
              </svg>
            </div>
          </div>
          <span id="email-error" class="field-error" role="alert" aria-live="polite"></span>
        </div>

        <div class="field-group">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input type="password" id="password" name="password" autocomplete="new-password"
              placeholder="Min. 12 characters" minlength="12" maxlength="128" required
              aria-required="true" aria-describedby="password-error caps-warning password-strength">
            <button type="button" class="toggle-pw" id="toggle-pw" aria-label="Show password" aria-pressed="false">
              <svg class="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z" fill="currentColor"/>
              </svg>
            </button>
          </div>
          <span id="caps-warning" class="caps-warn" aria-live="polite" hidden>⇪ Caps Lock is on</span>
          <div id="password-strength" class="strength-bar-wrap" aria-live="polite">
            <div class="strength-single-bar"><div id="strength-fill" class="strength-fill"></div></div>
            <span id="strength-label" class="strength-label"></span>
          </div>
          <span id="password-error" class="field-error" role="alert" aria-live="polite"></span>
        </div>

        <div class="field-group">
          <label for="confirm-password">Confirm password</label>
          <div class="input-wrap">
            <input type="password" id="confirm-password" name="confirm_password"
              autocomplete="new-password" placeholder="Re-enter your password"
              maxlength="128" required aria-required="true" aria-describedby="confirm-error">
            <button type="button" class="toggle-pw" id="toggle-confirm" aria-label="Show confirm password" aria-pressed="false">
              <svg class="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z" fill="currentColor"/>
              </svg>
            </button>
          </div>
          <span id="confirm-error" class="field-error" role="alert" aria-live="polite"></span>
        </div>

        <button type="submit" class="submit-btn" id="submit-btn">
          <span class="btn-text">Create account</span>
          <span class="btn-spinner" aria-hidden="true" hidden>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2.5" stroke-dasharray="31.4" stroke-dashoffset="10" stroke-linecap="round"/>
            </svg>
          </span>
        </button>
      </form>

      <p class="signup-prompt">Already have an account? <a href="/">Sign in</a></p>

      <div class="security-badge" aria-label="Security information">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z" fill="currentColor"/>
        </svg>
        Protected by 256-bit TLS encryption
      </div>
    </div>
  </main>

  <script src="../js/signup.js"></script>
</body>
</html>
